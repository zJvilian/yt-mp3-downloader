services:
  web:
    build:
      context: .
      dockerfile: dockerfile
    container_name: yt2mp3
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - "${BIND_ADDR:-127.0.0.1}:5000:5000"  # set BIND_ADDR in .env to expose on a server's LAN IP
    env_file:
      - .env        # optional, for FLASK_SECRET
    environment:
      - FLASK_ENV=production
      - FLASK_APP=app
    volumes:
      - ./mp3s:/app/mp3s
      - ./mp4s:/app/mp4s
      - ./cookies.txt:/app/cookies.txt:ro
